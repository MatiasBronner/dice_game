<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling Die Maze</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: a lit tabletop stage fills the left; a slim instrument panel sits to its right. One night-table world, single theme. */
:root{
 --night:#121729;--night2:#1b2342;--ink:#eef1fa;--muted:#98a2c3;--line:rgba(190,205,255,.12);
 --panel:rgba(26,33,60,.78);--raised:rgba(255,255,255,.05);
 --amber:#ffb547;--amberbg:rgba(255,181,71,.12);--lock:#5f8bff;--spin:#a78bfa;--flip:#34d399;--exit:#7ef0b8;--danger:#ff7a7a;
 --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
 --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 30% 35%,#26305a 0%,transparent 60%),radial-gradient(900px 600px at 90% 100%,#2a1f4d 0%,transparent 55%),var(--night);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 16px;transition:background .15s,border-color .15s,transform .08s}
button:hover:not(:disabled){background:rgba(255,255,255,.1);border-color:rgba(190,205,255,.3)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn-p{background:linear-gradient(180deg,#ffc56b,#f5a431);color:#22170a;border-color:transparent;font-weight:700}
.btn-p:hover:not(:disabled){background:linear-gradient(180deg,#ffd085,#ffb547)}
.btn-ghost{background:transparent}
input,select{width:100%;background:rgba(10,14,30,.5);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
label{display:block;margin:14px 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mu{color:var(--muted)}
kbd{font:12px var(--body);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--raised)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.mark svg{width:26px;height:26px}
.barR{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 11px;border-radius:99px;background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.chip.ai{color:var(--amber);border-color:rgba(255,181,71,.35);background:var(--amberbg)}
.cloud{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cloud i{width:8px;height:8px;border-radius:50%;background:#59617f;display:inline-block}
.cloud[data-s="saved"] i{background:var(--flip)}.cloud[data-s="saving"] i{background:var(--amber)}.cloud[data-s="error"] i,.cloud[data-s="off"] i{background:var(--danger)}

/* screens */
.screen{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.sheet{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet.wide{max-width:980px}
.sheet p{max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
.tabs{display:flex;gap:6px;margin:18px 0 6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 6px;margin-right:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.note{border:1px solid var(--line);background:rgba(10,14,30,.35);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.note.ok{border-color:rgba(52,211,153,.35)}.note.warn{border-color:rgba(255,181,71,.4);background:var(--amberbg)}.note.bad{border-color:rgba(255,122,122,.4)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:rgba(10,14,30,.35)}
tr:last-child td{border-bottom:0}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.pill.ok{color:var(--flip);border-color:rgba(52,211,153,.4)}.pill.run{color:var(--amber);border-color:rgba(255,181,71,.4)}

/* intro */
.introGrid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:26px;align-items:center}
@media (max-width:640px){.introGrid{grid-template-columns:1fr}}
.showcase{aspect-ratio:1;border-radius:20px;background:radial-gradient(circle at 50% 40%,rgba(120,140,255,.18),transparent 70%);position:relative;overflow:hidden}
.showcase canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.bigtitle{font-size:clamp(34px,5vw,52px);line-height:1;font-weight:800;letter-spacing:-.035em;margin:6px 0 14px}
.keys{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 20px;font-size:14px;color:var(--muted)}

/* game */
.game{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
@media (max-width:860px){.game{grid-template-columns:1fr}}
.stage{position:relative;min-height:420px;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
@media (max-width:860px){.stage{height:min(100vw,62vh);min-height:0}}
.legend{position:absolute;left:18px;bottom:16px;display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
.panel{border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(26,33,60,.7),rgba(18,23,41,.85));padding:22px 20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
@media (max-width:860px){.panel{border-left:0;border-top:1px solid var(--line)}}
.lvhead{display:flex;justify-content:space-between;align-items:flex-end}
.lvnum{font-family:var(--display);font-size:44px;font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.lvnum small{font-size:20px;color:var(--muted);font-weight:600;letter-spacing:0}
.moves{text-align:right}.moves b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.moves span,.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.track{display:flex;gap:5px}
.track i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
.track i.done{background:var(--flip)}.track i.skip{background:#6b7393}.track i.now{background:var(--amber)}
.rule{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(95,139,255,.1);border:1px solid rgba(95,139,255,.3);font-size:14px}
.rule .sw{width:30px;height:30px;font-size:16px;background:var(--lock);flex:none}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.face{text-align:center;padding:10px 4px 8px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.face svg{width:44px;height:44px;display:block;margin:0 auto 6px}
.face.top{border-color:rgba(255,181,71,.35)}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:7px;justify-content:center}
.pad button{padding:0;font-size:18px;border-radius:14px;background:rgba(255,255,255,.06)}
.pad .n{grid-column:2}.pad .w{grid-column:1;grid-row:2}.pad .s{grid-column:2;grid-row:2}.pad .e{grid-column:3;grid-row:2}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts button{flex:1}
.help{border-color:rgba(255,181,71,.45);color:var(--amber)}
.tier{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.tier i{width:6px;height:6px;border-radius:50%;background:rgba(255,181,71,.25)}.tier i.on{background:var(--amber)}
.msg{min-height:22px;font-size:14px;color:var(--amber)}
.msg.info{color:var(--spin)}
.hint{border-radius:16px;padding:14px 16px;background:var(--amberbg);border:1px solid rgba(255,181,71,.35);font-size:14px;animation:rise .35s ease-out}
.hint .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;color:var(--amber);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.doneOv{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,13,26,.35);backdrop-filter:blur(2px);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.donecard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 30px;text-align:center;min-width:280px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.ring{width:120px;height:120px;margin:6px auto 12px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.ring div small{display:block;font-size:12px;font-family:var(--body);color:var(--muted);font-weight:400;margin-top:-8px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted)}

/* quiz */
.qdie{width:130px;height:130px;flex:none}
.nums{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.nums button{width:56px;height:56px;font-family:var(--display);font-size:22px;font-weight:700;border-radius:14px}
.qprog{display:flex;gap:5px;margin:4px 0 18px}.qprog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}.qprog i.on{background:var(--amber)}

/* dialog + toast */
.dlg{position:fixed;inset:0;background:rgba(5,8,18,.6);display:grid;place-items:center;z-index:50;padding:18px}
.dlg .sheet{max-width:440px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--night2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
textarea{width:100%;height:220px;background:rgba(10,14,30,.6);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:12px ui-monospace,monospace;padding:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>

function dominant(){if(dist()==Infinity)return"deadend";const c={};G.recent.forEach(t=>c[t]=(c[t]||0)+1);
 for(const t of["repeat_block","loop","idle"])if((c[t]||0)>=2)return t;return"general"}
function giveHint(auto){G.tier=Math.min(G.tier+1,3);G.hints++;if(auto)G.autoHints++;G.lastHintAt=now();G.actsSinceHint=0;G.score=0;
 const p=bfs(L,G.r,G.c,G.o),type=dominant();G.hlCell=null;G.hlDir=null;let label,t;
 if(!p){label="Hint";t="From here the exit can't be reached. Undo a few moves and try another way."}
 else if(G.tier==1){label="Nudge";
  t=type=="loop"?"You've had the die in this exact position before. Sometimes the way forward is a small detour, rolling around a loop just to turn the die so the right face ends up where you need it."
   :type=="repeat_block"?`Before you roll, try to predict which number will end up on the ${faceName(L.rule)}. Watch the side faces: they tell you what's coming.`
   :"Look at the numbered squares you'll have to cross. Which face will each one need, and how could you get the die to arrive that way?"}
 else if(G.tier==2){label="Concept";let r=G.r,c=G.c,o=G.o;
  for(const d of p){const m=tryMove(L,r,c,o,d);const cell=L.g[m.r][m.c];
   if(cell.tile){G.hlCell=[m.r,m.c];t=cell.tile=="spin"?"Squares marked ↻ give the die a quarter turn clockwise (seen from above). The top stays the same, but every side face moves round by one. A good route uses the highlighted one.":"Squares marked ⇅ turn the die upside down. Top and bottom swap, and so do front and back. A good route uses the highlighted one.";break}
   if(cell.num){G.hlCell=[m.r,m.c];t=`Rolling tips the die over the edge in that direction: the top face goes down that side, and the face on the far side comes up. On a good route, the next number you cross is the highlighted square, so the ${faceName(L.rule)} must show ${cell.num} when you arrive.${L.rule=="bottom"?" Opposite faces always add up to 7, so the bottom is 7 minus the top.":""}`;break}
   r=m.r;c=m.c;o=m.o}
  t=t||"Rolling tips the die over the edge in that direction: the top face goes down that side, and the face on the far side comes up. The rest of the best route has no number locks."}
 else{label="Next move";G.hlDir=p[0];G.hlCell=[G.r+D[p[0]][0],G.c+D[p[0]][1]];t=`Roll ${DIRNAME[p[0]]} ${ARROW[p[0]]}, onto the highlighted square.`}
 G.hint={auto,label,t,tier:G.tier};log("hint",{auto,tier:G.tier,label,cause:type,dist:p?p.length:null});drawPanel()}
function finish(skipped){G.done=true;G.skipped=skipped;clearInterval(idleTimer);
 const e={level:S.i+1,kind:L.kind,rule:L.rule,solved:!skipped,skipped,moves:G.moves,opt:L.opt,efficiency:skipped?null:+(L.opt/G.moves).toFixed(3),
  undos:G.undos,blocked:G.blocked,hints:G.hints,autoHints:G.autoHints,maxTier:G.tier,detectorFires:G.fires,maxStruggle:+G.maxScore.toFixed(2),
  uniqueStates:G.visits.size,secs:Math.round((now()-G.t)/1000)};S.res.push(e);log(skipped?"level_skipped":"level_done",e);cloudFlush();
 G.hlCell=null;G.hlDir=null;setHighlight(null);if(!skipped&&V.ok)V.q.push({dur:60,step:()=>{},end:()=>confetti(G.r,G.c)});
 drawPanel();setTimeout(drawDone,skipped?0:450)}
function next(){S.i++;G=null;if(S.i<S.plan.length)startLevel();else quizStart()}

/* ---------- game screen ---------- */
function buildGame(){const isPrac=L.kind=="practice";
 app.innerHTML=bar(`<span class="chip">Numbers check the&nbsp;<b style="color:var(--ink)">${L.rule} face</b></span>${S.cond=="adaptive"?`<span class="chip ai">Assistant on</span>`:""}`)+
 `<main class="game"><section class="stage" id="stage" aria-label="Game board">
  <div class="legend"><span><i class="sw" style="background:var(--lock)">4</i>Number lock</span><span><i class="sw" style="background:var(--spin)">↻</i>?</span><span><i class="sw" style="background:var(--flip)">⇅</i>?</span><span><i class="sw" style="background:var(--exit);color:#0b3324">⚑</i>Exit</span></div>
 </section><aside class="panel" id="panel"></aside></main>`;
 const st=$("#stage");mount(st);if(V.ok){buildBoard(L);placeDie(G.r,G.c,G.o)}
 let sx=null,sy=null;st.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};st.onpointerup=e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;act(Math.abs(dx)>Math.abs(dy)?(dx>0?"E":"W"):(dy>0?"S":"N"))};
 drawPanel()}
function drawPanel(){const pn=$("#panel");if(!pn||!G)return;const o=G.o,dn=G.done,isPrac=L.kind=="practice";
 const numbered=S.plan.filter(x=>x.kind!="practice"),idx=numbered.indexOf(S.plan[S.i])+1;
 const track=numbered.map((def,i)=>{const r=S.res.find(x=>x.level==S.plan.indexOf(def)+1);return`<i class="${r?(r.skipped?"skip":"done"):i+1==idx?"now":""}"></i>`}).join("");
 pn.innerHTML=`<div class="lvhead"><div><div class="lbl">${isPrac?"Practice":"Level"}</div><div class="lvnum">${isPrac?"P":idx}<small>${isPrac?"":" / "+numbered.length}</small></div></div>
  <div class="moves"><span>Moves</span><b>${G.moves}</b></div></div>
 <div class="track" aria-hidden="true">${track}</div>
 <div class="rule"><span class="sw">#</span><div>Numbered squares check the <b>${L.rule=="top"?"top face":"bottom face"}</b>${L.rule=="bottom"?" (touching the board)":""}.</div></div>
 <div class="faces" aria-label="Die faces"><div class="face top">${faceSVG(o[0])}<span class="lbl">Top</span></div><div class="face">${faceSVG(7-o[1])}<span class="lbl">Front</span></div><div class="face">${faceSVG(o[2])}<span class="lbl">Right</span></div></div>
 <div class="pad"><button class="n" data-d="N" aria-label="Roll up">▲</button><button class="w" data-d="W" aria-label="Roll left">◀</button><button class="s" data-d="S" aria-label="Roll down">▼</button><button class="e" data-d="E" aria-label="Roll right">▶</button></div>
 <div class="acts"><button id="un" ${dn||!G.hist.length?"disabled":""}>↶ Undo</button>${S.cond=="user"&&!dn?`<button id="hp" class="help">Help${G.tier?`<span class="tier">${[1,2,3].map(i=>`<i class="${i<=G.tier?"on":""}"></i>`).join("")}</span>`:""}</button>`:""}${!dn&&G.skipShown?`<button id="sk" class="btn-ghost">Skip level</button>`:""}</div>
 <div class="msg ${G.msgInfo?"info":""}" role="status">${G.msg}</div>
 ${G.hint&&!dn?`<div class="hint" role="status"><div class="h"><span>${G.hint.auto?"Assistant":"Help"} · ${G.hint.label}</span><span class="tier">${[1,2,3].map(i=>`<i class="${i<=G.hint.tier?"on":""}"></i>`).join("")}</span></div>${G.hint.t}</div>`:""}`;
 setHighlight(dn?null:G.hlCell,G.hlDir);
 pn.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>act(b.dataset.d));
 $("#un").onclick=undo;if($("#hp"))$("#hp").onclick=()=>{log("help_click");giveHint(false)};
 if($("#sk"))$("#sk").onclick=async()=>{if(await ask("Skip this level?","It will be recorded as unsolved.","Skip level"))finish(true)}}
function drawDone(){const st=$("#stage");if(!st||!G||!G.done||$("#doneOv"))return;const isPrac=L.kind=="practice",eff=G.skipped?0:Math.min(1,L.opt/G.moves),C=2*Math.PI*52;
 const el=document.createElement("div");el.className="doneOv";el.id="doneOv";el.setAttribute("role","dialog");el.setAttribute("aria-label","Level complete");
 el.innerHTML=`<div class="donecard">${G.skipped?`<h2 style="font-size:26px">Level skipped</h2><p class="mu">On to the next one.</p>`:`<div class="eyebrow">${isPrac?"Practice complete":"Solved"}</div>
 <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="${eff>=1?"#7ef0b8":"#ffb547"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*eff} ${C}"/></svg><div><span>${G.moves}<small>moves</small></span></div></div>
 <p style="margin:0">Best possible: <b>${L.opt}</b></p>${isPrac?`<p class="mu" style="margin:6px 0 0">That's the practice done. The real levels start now.</p>`:""}`}
 <button class="btn-p" id="nx" style="margin-top:16px;min-width:180px">${S.i+1<S.plan.length?"Next level":"Continue"}</button></div>`;
 st.appendChild(el);$("#nx").onclick=next;$("#nx").focus()}
document.addEventListener("keydown",e=>{if(DLG||!G||!L||Q||!$("#stage"))return;
 if(G.done){if(e.key=="Enter"&&$("#nx")){e.preventDefault();$("#nx").click()}return}
 if(e.target&&e.target.tagName=="BUTTON"&&(e.key=="Enter"||e.key==" "))return;
 const d=KEY[e.key];if(d){e.preventDefault();act(d)}else if(e.key=="z"||e.key=="Z"||e.key=="Backspace"){e.preventDefault();undo()}});

/* ======================= QUIZ ======================= */
function quizStart(){const R=rng((S.set=="B"?97:13)+S.session*1000);const pick=a=>a[Math.floor(R()*a.length)];
 const randO=()=>{let o=O0.slice();for(let k=0;k<25;k++){const r=R();o=r<.8?roll(o,pick("NSEW")):tileFx(o,"spin")}return o};
 const qs=[];
 for(let i=0;i<3;i++){const o=randO(),ds=[...Array(2+i)].map(()=>pick("NSEW"));let c=o;ds.forEach(d=>c=roll(c,d));qs.push({type:"top",o,ds,ask:"top",a:c[0]})}
 {const o=randO(),ds=[pick("NSEW"),pick("NSEW")];let c=o;ds.forEach(d=>c=roll(c,d));qs.push({type:"bottom",o,ds,ask:"bottom",a:7-c[0]})}
 {const o=randO(),d=pick("NSEW");const c=tileFx(roll(o,d),"spin");qs.push({type:"spin",o,ds:[d],tile:"spin",ask:"right",a:c[2]})}
 {const o=randO(),d=pick("NSEW");const c=tileFx(roll(o,d),"flip");qs.push({type:"flip",o,ds:[d],tile:"flip",ask:"top",a:c[0]})}
 Q={i:0,qs};S.i=-1;L=null;V.host=null;log("quiz_start");qNext()}
function qNext(){if(Q.i>=Q.qs.length)return end();const q=Q.qs[Q.i];
 const askTxt=q.ask=="top"?"on <b>top</b>":q.ask=="bottom"?"on the <b>bottom</b> (touching the board)":"facing <b>right</b>";
 const seq=q.ds.map(d=>DIRNAME[d]+" "+ARROW[d]).join(", then ");
 app.innerHTML=bar()+`<main class="screen"><div class="sheet"><div class="eyebrow">Quick check</div><h1 style="font-size:28px;margin:4px 0 10px">Question ${Q.i+1} of ${Q.qs.length}</h1>
 <div class="qprog">${Q.qs.map((_,i)=>`<i class="${i<=Q.i?"on":""}"></i>`).join("")}</div>
 <p class="mu" style="margin-top:0">Work it out in your head.</p>
 <div class="row" style="gap:20px;align-items:center"><div class="qdie">${dieSVG(q.o)}</div>
 <p style="flex:1;min-width:220px;margin:0">The die shows <b>${q.o[0]}</b> on top, <b>${7-q.o[1]}</b> on the front and <b>${q.o[2]}</b> on the right.<br>It rolls <b>${seq}</b>${q.tile?`, landing on a <b style="color:var(--${q.tile})">${q.tile=="spin"?"↻":"⇅"}</b> square`:""}.<br>What number is now ${askTxt}?</p></div>
 <div class="nums">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}">${n}</button>`).join("")}</div><p class="mu" style="margin-top:14px;font-size:14px">"Up" means away from you, toward the back of the board.</p></div></main>`;
 const shown=now();app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.n==q.a;S.quiz.push({q:Q.i+1,type:q.type,answer:+b.dataset.n,correct:q.a,ok,secs:+((now()-shown)/1000).toFixed(1)});log("quiz",{q:Q.i+1,qtype:q.type,ans:+b.dataset.n,ok});Q.i++;qNext()})}

/* ======================= END + EXPORT ======================= */
function toCSV(rows){if(!rows.length)return"";const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
 return[cols.join(",")].concat(rows.map(r=>cols.map(c=>{const v=r[c];const s=v==null?"":typeof v=="object"?JSON.stringify(v):String(v);return'"'+s.replace(/"/g,'""')+'"'}).join(","))).join("\n")}
async function end(){S.finished=new Date().toISOString();log("session_end");Q=null;const s=S;
 const base=`${s.pid}_session${s.session}_${s.group}_set${s.set}`,meta={pid:s.pid,session:s.session,group:s.group,assistance:s.cond,set:s.set};
 const off=s.plan[0].kind=="practice"?1:0;
 const rows=s.res.map(r=>`<tr><td>${r.kind=="practice"?"Practice":r.level-off}</td><td>${r.kind}${r.rule=="bottom"?" (bottom)":""}</td><td>${r.skipped?"skipped":r.moves+" / "+r.opt}</td><td>${r.hints}</td><td>${r.secs}s</td></tr>`).join("");
 app.innerHTML=bar()+`<main class="screen"><div class="sheet wide"><div class="eyebrow">Session complete</div><h1 class="bigtitle" style="font-size:44px">All done. Thank you!</h1>
 <p>You've finished this session. Please let the experimenter know.</p>
 <details style="margin-top:22px"><summary class="mu" style="cursor:pointer">Experimenter: results and exports</summary>
 <div id="sync" class="note">Saving to the database…</div>
 <div class="tbl"><table><tr><th>Level</th><th>Type</th><th>Moves / best</th><th>Hints</th><th>Time</th></tr>${rows}</table></div>
 <p>Rule check: <b>${s.quiz.filter(q=>q.ok).length} / ${s.quiz.length}</b> correct.</p>
 <div class="row"><button class="btn-p" id="j">Full log (JSON)</button><button id="c1">Levels CSV</button><button id="c2">Events CSV</button><button id="c3">Quiz CSV</button><button id="nw" class="btn-ghost">New session</button></div></details></div></main>`;
 $("#j").onclick=()=>exportFile(base+".json",JSON.stringify(exportObj(s),null,1));
 $("#c1").onclick=()=>exportFile(base+"_levels.csv",toCSV(s.res.map(r=>({...meta,...r}))));
 $("#c2").onclick=()=>exportFile(base+"_events.csv",toCSV(s.log.map(r=>({...meta,...r}))));
 $("#c3").onclick=()=>exportFile(base+"_quiz.csv",toCSV(s.quiz.map(r=>({...meta,...r}))));
 $("#nw").onclick=()=>{setupTab="run";setup()};
 let ok=false;if(Cloud.db||SB.on){s.cloudTo=0;ok=await cloudFlush(s);if(Cloud.db)await registerParticipant(s)}
 const el=$("#sync");if(el){el.className="note "+(ok?"ok":"bad");el.textContent=ok?"Saved to the database.":Cloud.db||SB.on?"Couldn't reach the database. The session is kept in this browser; upload it later from Collected data.":"No database here. The session is kept in this browser; download it below."}}

window.__rdm={CFG,get S(){return S},get G(){return G},get L(){return L},bfs,act,undo,V,Cloud};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="hidden"&&S)cloudFlush()});
cloudInit();setup();
</script></body></html>
